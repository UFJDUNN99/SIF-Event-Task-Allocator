<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldJob - Job Allocation & WhatsApp Dispatch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for in-browser JSX -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [jobs, setJobs] = React.useState([
                { id: 1, title: 'Fix HVAC Unit #4', client: 'Acme Corp', location: '123 Industrial Pkwy', priority: 'High', status: 'Pending', worker: null, phone: '' },
                { id: 2, title: 'Electrical Panel Inspection', client: 'Metropolitan Hotel', location: '45 Grand Ave', priority: 'Medium', status: 'Allocated', worker: 'Sarah Jenkins', phone: '+447700900077' },
                { id: 3, title: 'Emergency Plumbing Leak', client: 'Central Station', location: '8 Station Rd', priority: 'Urgent', status: 'In Progress', worker: 'Dave Smith', phone: '+447700900088' },
            ]);
            
            const [workers] = React.useState([
                { name: 'Sarah Jenkins', phone: '+447700900077' },
                { name: 'Dave Smith', phone: '+447700900088' },
                { name: 'Elena Rostova', phone: '+447700900099' }
            ]);

            const [newJob, setNewJob] = React.useState({ title: '', client: '', location: '', priority: 'Medium' });
            const [toast, setToast] = React.useState(null);
            const [selectedWhatsApp, setSelectedWhatsApp] = React.useState(null);

            const handleCreateJob = (e) => {
                e.preventDefault();
                if (!newJob.title || !newJob.client) return;
                const job = { id: Date.now(), ...newJob, status: 'Pending', worker: null, phone: '' };
                setJobs([job, ...jobs]);
                setNewJob({ title: '', client: '', location: '', priority: 'Medium' });
                showToast("New job created successfully!");
            };

            const assignWorker = (jobId, workerName) => {
                const worker = workers.find(w => w.name === workerName);
                setJobs(jobs.map(j => {
                    if (j.id === jobId) {
                        const updated = { ...j, status: 'Allocated', worker: workerName, phone: worker.phone };
                        triggerWhatsApp(updated);
                        return updated;
                    }
                    return j;
                }));
            };

            const triggerWhatsApp = (job) => {
                const message = `📋 *NEW JOB ALLOCATED*\n\n*Task:* ${job.title}\n*Client:* ${job.client}\n*Location:* ${job.location}\n*Priority:* ${job.priority}\n\nPlease reply ACK to accept.`;
                setSelectedWhatsApp({ worker: job.worker, phone: job.phone, message });
                showToast(`WhatsApp notification sent to ${job.worker}!`);
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 4000);
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <span className="text-2xl font-black tracking-tight">FieldJob WhatsApp</span>
                                <span className="bg-emerald-600 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-bold">Live Dispatch</span>
                            </div>
                            <div className="text-sm bg-emerald-800 px-3 py-1.5 rounded-lg">
                                Manager: <strong>Admin User</strong>
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border-l-4 border-emerald-500 animate-bounce">
                            <span>💬 {toast}</span>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Left Column: Quick Job Entry Form */}
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                            <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                <span className="bg-emerald-100 text-emerald-800 p-2 rounded-lg mr-2 text-sm">➕</span>
                                Create & Allocate Job
                            </h2>
                            <form onSubmit={handleCreateJob} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Job Title / Task</label>
                                    <input type="text" required placeholder="e.g. Fix water pump" value={newJob.title} onChange={e => setNewJob({...newJob, title: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Client Name</label>
                                    <input type="text" required placeholder="e.g. Acme Corp" value={newJob.client} onChange={e => setNewJob({...newJob, client: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Location / Address</label>
                                    <input type="text" required placeholder="e.g. 14 Baker St" value={newJob.location} onChange={e => setNewJob({...newJob, location: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Priority</label>
                                    <select value={newJob.priority} onChange={e => setNewJob({...newJob, priority: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                        <option>Normal</option>
                                        <option>Medium</option>
                                        <option>High</option>
                                        <option>Urgent</option>
                                    </select>
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                                    Publish Job
                                </button>
                            </form>

                            {/* WhatsApp Simulator Preview Box */}
                            {selectedWhatsApp && (
                                <div className="mt-6 bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="text-xs font-bold text-emerald-800 uppercase flex items-center">
                                            📱 WhatsApp Outbox Preview
                                        </span>
                                        <a href={`https://wa.me/${selectedWhatsApp.phone.replace('+', '')}?text=${encodeURIComponent(selectedWhatsApp.message)}`} target="_blank" className="text-xs bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold hover:bg-emerald-700">
                                            Open WhatsApp Web ↗
                                        </a>
                                    </div>
                                    <p className="text-xs text-slate-600 mb-1">Sent to: <strong>{selectedWhatsApp.worker}</strong> ({selectedWhatsApp.phone})</p>
                                    <div className="bg-white p-3 rounded-lg border border-emerald-100 text-xs text-slate-800 whitespace-pre-wrap font-mono">
                                        {selectedWhatsApp.message}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Right Column: Job List & Allocation Manager */}
                        <div className="lg:col-span-2 space-y-4">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold text-slate-800">Outstanding & Active Jobs</h2>
                                    <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold">{jobs.length} Total</span>
                                </div>

                                <div className="space-y-3">
                                    {jobs.map(job => (
                                        <div key={job.id} className="border border-slate-200 rounded-xl p-4 hover:border-emerald-300 transition bg-white shadow-xs">
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                                <div>
                                                    <div className="flex items-center space-x-2">
                                                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                                                            job.priority === 'Urgent' ? 'bg-rose-100 text-rose-700' :
                                                            job.priority === 'High' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
                                                        }`}>{job.priority}</span>
                                                        <span className="text-xs font-semibold text-slate-400">ID: #{job.id.toString().slice(-4)}</span>
                                                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                                                            job.status === 'Pending' ? 'bg-slate-100 text-slate-600' :
                                                            job.status === 'Allocated' ? 'bg-emerald-100 text-emerald-800' : 'bg-indigo-100 text-indigo-800'
                                                        }`}>{job.status}</span>
                                                    </div>
                                                    <h3 className="font-bold text-slate-900 mt-1 text-base">{job.title}</h3>
                                                    <p className="text-xs text-slate-600">🏢 {job.client} • 📍 {job.location}</p>
                                                </div>

                                                {/* Assignment Controls */}
                                                <div className="flex items-center space-x-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                                                    <select 
                                                        value={job.worker || ''} 
                                                        onChange={(e) => assignWorker(job.id, e.target.value)}
                                                        className="text-xs border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 font-medium focus:ring-2 focus:ring-emerald-500 outline-none"
                                                    >
                                                        <option value="" disabled>Assign Worker...</option>
                                                        {workers.map(w => (
                                                            <option key={w.name} value={w.name}>{w.name}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
