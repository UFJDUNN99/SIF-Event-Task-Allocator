<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FieldJob - Job Allocation & Incident Logging</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for in-browser JSX -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Persistent State with LocalStorage
            const [departments, setDepartments] = React.useState(() => {
                const saved = localStorage.getItem('fj_departments');
                return saved ? JSON.parse(saved) : ['Operational', 'Production', 'Security', 'First Aid'];
            });

            const [jobs, setJobs] = React.useState(() => {
                const saved = localStorage.getItem('fj_jobs');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'Main Assembly Line Jam', client: 'Plant Alpha', location: 'Building B', priority: 'High', type: 'Job Assignment', status: 'Pending', assignedWorkers: [], createdAt: new Date().toISOString() },
                    { id: 2, title: 'Minor Slip on Wet Floor', client: 'Warehouse 2', location: 'Loading Bay', priority: 'Urgent', type: 'Incident Report', status: 'Logged Only', assignedWorkers: [], createdAt: new Date().toISOString() }
                ];
            });
            
            const [workers, setWorkers] = React.useState(() => {
                const saved = localStorage.getItem('fj_workers');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: 'John Doe', phone: '+447700900077', department: 'Operational' },
                    { id: 2, name: 'Jane Smith', phone: '+447700900088', department: 'Production' },
                    { id: 3, name: 'Guard Mike', phone: '+447700900099', department: 'Security' },
                    { id: 4, name: 'Medic Sarah', phone: '+447700900111', department: 'First Aid' }
                ];
            });

            // Save to LocalStorage
            React.useEffect(() => { localStorage.setItem('fj_departments', JSON.stringify(departments)); }, [departments]);
            React.useEffect(() => { localStorage.setItem('fj_jobs', JSON.stringify(jobs)); }, [jobs]);
            React.useEffect(() => { localStorage.setItem('fj_workers', JSON.stringify(workers)); }, [workers]);

            // Form inputs
            const [newDeptInput, setNewDeptInput] = React.useState('');
            const [newJob, setNewJob] = React.useState({ title: '', client: '', location: '', priority: 'Medium', type: 'Job Assignment' });
            const [newWorker, setNewWorker] = React.useState({ name: '', phone: '', department: 'Operational' });
            
            // Sorting State
            const [prioritySortOrder, setPrioritySortOrder] = React.useState('none'); // 'none', 'highest', 'lowest'

            // Edit Job Modal State
            const [editingJob, setEditingJob] = React.useState(null);

            // Allocation Modal State
            const [allocatingJobId, setAllocatingJobId] = React.useState(null);
            const [selectedDeptFilter, setSelectedDeptFilter] = React.useState('All');
            const [selectedWorkerIds, setSelectedWorkerIds] = React.useState([]);

            const [toast, setToast] = React.useState(null);
            const [selectedWhatsAppList, setSelectedWhatsAppList] = React.useState(null);

            // Department Management
            const handleAddDepartment = (e) => {
                e.preventDefault();
                const trimmed = newDeptInput.trim();
                if (!trimmed) return;
                if (departments.map(d => d.toLowerCase()).includes(trimmed.toLowerCase())) {
                    showToast("Department already exists!");
                    return;
                }
                setDepartments([...departments, trimmed]);
                setNewDeptInput('');
                showToast(`Department "${trimmed}" added!`);
            };

            const handleRemoveDepartment = (deptToRemove) => {
                if (departments.length <= 1) {
                    showToast("You must keep at least one department.");
                    return;
                }
                setDepartments(departments.filter(d => d !== deptToRemove));
                showToast(`Department "${deptToRemove}" removed.`);
            };

            // Task Actions
            const handleCreateJob = (e) => {
                e.preventDefault();
                if (!newJob.title || !newJob.client) return;
                
                const jobStatus = newJob.type === 'Incident Report' ? 'Logged Only' : 'Pending';
                const job = { 
                    id: Date.now(), 
                    ...newJob, 
                    status: jobStatus, 
                    assignedWorkers: [], 
                    createdAt: new Date().toISOString() 
                };

                setJobs([job, ...jobs]);
                setNewJob({ title: '', client: '', location: '', priority: 'Medium', type: 'Job Assignment' });
                showToast(newJob.type === 'Incident Report' ? "Incident logged successfully!" : "New job created successfully!");
            };

            const handleSaveEditJob = (e) => {
                e.preventDefault();
                if (!editingJob) return;
                
                const updatedStatus = editingJob.type === 'Incident Report' ? 'Logged Only' : (editingJob.assignedWorkers.length > 0 ? 'Allocated' : 'Pending');
                const finalJob = { ...editingJob, status: updatedStatus };

                setJobs(jobs.map(j => j.id === finalJob.id ? finalJob : j));
                setEditingJob(null);
                showToast("Record amended successfully!");
            };

            const handleDeleteJob = (jobId) => {
                if (confirm("Are you sure you want to delete this record?")) {
                    setJobs(jobs.filter(j => j.id !== jobId));
                    showToast("Record deleted.");
                }
            };

            const handleAddWorker = (e) => {
                e.preventDefault();
                if (!newWorker.name || !newWorker.phone) return;
                const activeDept = newWorker.department || departments[0];
                setWorkers([...workers, { id: Date.now(), ...newWorker, department: activeDept }]);
                setNewWorker({ name: '', phone: '', department: departments[0] });
                showToast(`Worker ${newWorker.name} added to ${activeDept}!`);
            };

            const removeWorker = (id) => {
                setWorkers(workers.filter(w => w.id !== id));
                showToast("Worker removed from directory.");
            };

            // Allocation Controls
            const openAllocationModal = (job) => {
                if (job.type === 'Incident Report') {
                    showToast("Incident reports are for logging only and cannot have tasks allocated.");
                    return;
                }
                setAllocatingJobId(job.id);
                setSelectedWorkerIds(job.assignedWorkers.map(w => w.phone));
            };

            const toggleWorkerSelection = (phone) => {
                if (selectedWorkerIds.includes(phone)) {
                    setSelectedWorkerIds(selectedWorkerIds.filter(p => p !== phone));
                } else {
                    setSelectedWorkerIds([...selectedWorkerIds, phone]);
                }
            };

            const saveJobAssignments = () => {
                const assignedObjects = workers.filter(w => selectedWorkerIds.includes(w.phone));
                
                setJobs(jobs.map(j => {
                    if (j.id === allocatingJobId) {
                        const updated = { 
                            ...j, 
                            status: assignedObjects.length > 0 ? 'Allocated' : 'Pending', 
                            assignedWorkers: assignedObjects 
                        };
                        if (assignedObjects.length > 0) {
                            triggerWhatsAppGroup(updated);
                        }
                        return updated;
                    }
                    return j;
                }));

                setAllocatingJobId(null);
            };

            const triggerWhatsAppGroup = (job) => {
                const dispatches = job.assignedWorkers.map(w => {
                    const message = `📋 *NEW JOB ALLOCATED*\n\n*Task:* ${job.title}\n*Client:* ${job.client}\n*Location:* ${job.location}\n*Priority:* ${job.priority}\n*Team Members:* ${job.assignedWorkers.map(x => x.name).join(', ')}\n\nPlease reply ACK to accept.`;
                    return { worker: w.name, phone: w.phone, message };
                });

                setSelectedWhatsAppList(dispatches);
                showToast(`WhatsApp notifications ready for ${dispatches.length} team member(s)!`);
            };

            // Download CSV Report
            const downloadCSVReport = () => {
                if (jobs.length === 0) {
                    showToast("No records available to export.");
                    return;
                }

                const headers = ["ID", "Record Type", "Title / Event", "Client / Area", "Location", "Priority", "Status", "Assigned Team", "Created Date"];
                const rows = jobs.map(j => [
                    `"${j.id}"`,
                    `"${j.type || 'Job Assignment'}"`,
                    `"${j.title.replace(/"/g, '""')}"`,
                    `"${j.client.replace(/"/g, '""')}"`,
                    `"${j.location.replace(/"/g, '""')}"`,
                    `"${j.priority}"`,
                    `"${j.status}"`,
                    `"${j.assignedWorkers.map(w => `${w.name} (${w.department})`).join('; ')}"`,
                    `"${new Date(j.createdAt || Date.now()).toLocaleString()}"`
                ]);

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `FieldJob_Incident_Report_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("CSV report downloaded!");
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 4000);
            };

            const filteredWorkers = selectedDeptFilter === 'All' 
                ? workers 
                : workers.filter(w => w.department === selectedDeptFilter);

            const activeAllocatingJob = jobs.find(j => j.id === allocatingJobId);

            // Sorting logic for priorities
            const priorityWeight = { 'Urgent': 4, 'High': 3, 'Medium': 2, 'Normal': 1 };
            const sortedJobs = [...jobs].sort((a, b) => {
                if (prioritySortOrder === 'highest') {
                    return (priorityWeight[b.priority] || 0) - (priorityWeight[a.priority] || 0);
                } else if (prioritySortOrder === 'lowest') {
                    return (priorityWeight[a.priority] || 0) - (priorityWeight[b.priority] || 0);
                }
                return 0; // default order
            });

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center flex-wrap gap-2">
                            <div className="flex items-center space-x-2">
                                <span className="text-2xl font-black tracking-tight">FieldJob & Incident Log</span>
                                <span className="bg-emerald-600 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-bold">Priority Sorting Active</span>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button 
                                    onClick={downloadCSVReport} 
                                    className="bg-emerald-800 hover:bg-emerald-900 text-white font-bold text-xs px-3.5 py-2 rounded-xl border border-emerald-600 shadow-sm flex items-center space-x-1 transition"
                                >
                                    <span>📊 Download CSV Report</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border-l-4 border-emerald-500 animate-bounce">
                            <span>💬 {toast}</span>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Left Column: Management Cards */}
                        <div className="space-y-6">

                            {/* 1. Custom Department Creator */}
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-3 flex items-center">
                                    <span className="bg-purple-100 text-purple-800 p-2 rounded-lg mr-2 text-sm">🏢</span>
                                    Departments
                                </h2>
                                <form onSubmit={handleAddDepartment} className="flex gap-2 mb-3">
                                    <input 
                                        type="text" 
                                        placeholder="Add dept..." 
                                        value={newDeptInput} 
                                        onChange={e => setNewDeptInput(e.target.value)} 
                                        className="flex-1 border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-purple-500 outline-none" 
                                    />
                                    <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                                        Add
                                    </button>
                                </form>
                                <div className="flex flex-wrap gap-1.5">
                                    {departments.map(dept => (
                                        <span key={dept} className="bg-purple-50 text-purple-900 border border-purple-200 text-xs font-semibold px-2.5 py-1 rounded-lg flex items-center gap-1.5">
                                            {dept}
                                            <button onClick={() => handleRemoveDepartment(dept)} className="text-purple-400 hover:text-rose-600 font-bold text-xs">✕</button>
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* 2. Create Job / Log Incident Card */}
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                    <span className="bg-emerald-100 text-emerald-800 p-2 rounded-lg mr-2 text-sm">📝</span>
                                    New Record Entry
                                </h2>
                                <form onSubmit={handleCreateJob} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Entry Purpose / Mode</label>
                                        <select 
                                            value={newJob.type} 
                                            onChange={e => setNewJob({...newJob, type: e.target.value})} 
                                            className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 outline-none bg-emerald-50 text-emerald-900"
                                        >
                                            <option value="Job Assignment">🔧 Job Assignment (Allocate & Notify)</option>
                                            <option value="Incident Report">🚨 Incident Report (Log Only)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">{newJob.type === 'Incident Report' ? 'Incident / Event Title' : 'Job Title / Task'}</label>
                                        <input type="text" required placeholder={newJob.type === 'Incident Report' ? 'e.g. Minor chemical spill' : 'e.g. Wire junction box'} value={newJob.title} onChange={e => setNewJob({...newJob, title: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Client / Area / Facility</label>
                                        <input type="text" required placeholder="e.g. Acme Corp" value={newJob.client} onChange={e => setNewJob({...newJob, client: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Location / Specific Spot</label>
                                        <input type="text" required placeholder="e.g. Room 402" value={newJob.location} onChange={e => setNewJob({...newJob, location: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Priority / Severity</label>
                                        <select value={newJob.priority} onChange={e => setNewJob({...newJob, priority: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                            <option>Normal</option>
                                            <option>Medium</option>
                                            <option>High</option>
                                            <option>Urgent</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                                        {newJob.type === 'Incident Report' ? 'Save Incident Log' : 'Publish & Ready for Allocation'}
                                    </button>
                                </form>
                            </div>

                            {/* 3. Manage Workers Card */}
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
                                    <span className="bg-blue-100 text-blue-800 p-2 rounded-lg mr-2 text-sm">👷</span>
                                    Add Worker
                                </h2>
                                <form onSubmit={handleAddWorker} className="space-y-3 mb-4 pb-4 border-b border-slate-100">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Worker Name</label>
                                        <input type="text" required placeholder="e.g. John Doe" value={newWorker.name} onChange={e => setNewWorker({...newWorker, name: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Department</label>
                                        <select value={newWorker.department || departments[0]} onChange={e => setNewWorker({...newWorker, department: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                            {departments.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">WhatsApp Phone</label>
                                        <input type="text" required placeholder="e.g. +447700900123" value={newWorker.phone} onChange={e => setNewWorker({...newWorker, phone: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md transition duration-200 text-sm">
                                        Add Worker
                                    </button>
                                </form>

                                <div className="space-y-2 max-h-48 overflow-y-auto">
                                    {workers.map(w => (
                                        <div key={w.id} className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                                            <div>
                                                <div className="flex items-center space-x-1">
                                                    <p className="font-bold text-slate-800">{w.name}</p>
                                                    <span className="bg-purple-100 text-purple-800 text-[10px] px-1.5 py-0.5 rounded font-semibold">{w.department}</span>
                                                </div>
                                                <p className="text-slate-500 font-mono mt-0.5">{w.phone}</p>
                                            </div>
                                            <button onClick={() => removeWorker(w.id)} className="text-rose-600 hover:text-rose-800 font-bold px-2 py-1">
                                                ✕
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Records Feed & Actions */}
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                                    <h2 className="text-lg font-bold text-slate-800">Outstanding Tasks & Incident Logs</h2>
                                    <div className="flex items-center space-x-2 flex-wrap gap-2">
                                        {/* Priority Sorting Selector */}
                                        <div className="flex items-center space-x-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-1 text-xs">
                                            <span className="font-bold text-slate-500">Sort:</span>
                                            <select 
                                                value={prioritySortOrder} 
                                                onChange={e => setPrioritySortOrder(e.target.value)}
                                                className="bg-transparent font-bold text-slate-700 outline-none cursor-pointer"
                                            >
                                                <option value="none">Default Order</option>
                                                <option value="highest">⚠️ Urgent First</option>
                                                <option value="lowest">🟢 Lowest Priority First</option>
                                            </select>
                                        </div>

                                        <button onClick={downloadCSVReport} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl border border-slate-300 transition">
                                            📥 Download Report CSV
                                        </button>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    {sortedJobs.length === 0 ? (
                                        <div className="p-8 text-center text-slate-400 font-medium">No records found. Create a job or incident log on the left!</div>
                                    ) : (
                                        sortedJobs.map(job => {
                                            const isIncident = job.type === 'Incident Report';
                                            return (
                                                <div key={job.id} className={`border rounded-xl p-4 transition bg-white shadow-xs ${isIncident ? 'border-amber-300 bg-amber-50/20' : 'border-slate-200 hover:border-emerald-300'}`}>
                                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                        <div>
                                                            <div className="flex items-center space-x-2 flex-wrap gap-y-1">
                                                                <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${isIncident ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}`}>
                                                                    {job.type || 'Job Assignment'}
                                                                </span>
                                                                <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                                                                    job.priority === 'Urgent' ? 'bg-rose-100 text-rose-700' :
                                                                    job.priority === 'High' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
                                                                }`}>{job.priority}</span>
                                                                <span className="text-xs font-semibold text-slate-400">ID: #{job.id.toString().slice(-4)}</span>
                                                                <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                                                                    job.status === 'Pending' ? 'bg-slate-100 text-slate-600' :
                                                                    job.status === 'Allocated' ? 'bg-emerald-100 text-emerald-800' :
                                                                    job.status === 'Logged Only' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'
                                                                }`}>{job.status}</span>
                                                            </div>
                                                            <h3 className="font-bold text-slate-900 mt-1 text-base">{job.title}</h3>
                                                            <p className="text-xs text-slate-600">🏢 {job.client} • 📍 {job.location}</p>
                                                            
                                                            {/* Assigned Team List */}
                                                            {!isIncident && (
                                                                job.assignedWorkers.length > 0 ? (
                                                                    <div className="mt-2 flex flex-wrap gap-1 items-center">
                                                                        <span className="text-xs font-bold text-slate-500 mr-1">Assigned Team:</span>
                                                                        {job.assignedWorkers.map(w => (
                                                                            <span key={w.phone} className="bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs px-2 py-0.5 rounded-md font-semibold">
                                                                                👤 {w.name} ({w.department})
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                ) : (
                                                                    <p className="text-xs text-amber-600 font-medium mt-1">⚠️ No team members assigned yet</p>
                                                                )
                                                            )}
                                                        </div>

                                                        {/* Control Buttons */}
                                                        <div className="flex flex-wrap items-center gap-1.5 self-start sm:self-center">
                                                            {!isIncident && (
                                                                <button 
                                                                    onClick={() => openAllocationModal(job)}
                                                                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-2 rounded-xl shadow-xs transition"
                                                                >
                                                                    ⚙️ Assign Team
                                                                </button>
                                                            )}
                                                            <button 
                                                                onClick={() => setEditingJob(job)}
                                                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-3 py-2 rounded-xl border border-slate-300 transition"
                                                            >
                                                                ✏️ Amend
                                                            </button>
                                                            <button 
                                                                onClick={() => handleDeleteJob(job.id)}
                                                                className="bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs px-2.5 py-2 rounded-xl border border-rose-200 transition"
                                                            >
                                                                🗑️ Delete
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>

                            {/* Multi-WhatsApp Outbox Preview */}
                            {selectedWhatsAppList && (
                                <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl">
                                    <h3 className="text-sm font-bold text-emerald-900 uppercase tracking-wide mb-3 flex items-center">
                                        📱 WhatsApp Dispatch Queue ({selectedWhatsAppList.length} Messages)
                                    </h3>
                                    <div className="space-y-3">
                                        {selectedWhatsAppList.map((item, idx) => (
                                            <div key={idx} className="bg-white p-3.5 rounded-xl border border-emerald-100 shadow-xs flex flex-col sm:flex-row justify-between gap-2 items-start sm:items-center">
                                                <div>
                                                    <p className="text-xs font-bold text-slate-800">To: {item.worker} <span className="font-mono text-slate-500">({item.phone})</span></p>
                                                    <p className="text-xs text-slate-600 mt-1 italic font-mono bg-slate-50 p-2 rounded border border-slate-100">{item.message}</p>
                                                </div>
                                                <a 
                                                    href={`https://wa.me/${item.phone.replace('+', '')}?text=${encodeURIComponent(item.message)}`} 
                                                    target="_blank" 
                                                    className="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-emerald-700 whitespace-nowrap"
                                                >
                                                    Send to {item.worker} ↗
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Amend Task Modal */}
                    {editingJob && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                                <h3 className="font-bold text-slate-900 text-base mb-4">✏️ Amend Record</h3>
                                <form onSubmit={handleSaveEditJob} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Purpose / Type</label>
                                        <select value={editingJob.type || 'Job Assignment'} onChange={e => setEditingJob({...editingJob, type: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white font-semibold">
                                            <option value="Job Assignment">Job Assignment</option>
                                            <option value="Incident Report">Incident Report (Log Only)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Title / Event</label>
                                        <input type="text" required value={editingJob.title} onChange={e => setEditingJob({...editingJob, title: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Client / Area</label>
                                        <input type="text" required value={editingJob.client} onChange={e => setEditingJob({...editingJob, client: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Location</label>
                                        <input type="text" required value={editingJob.location} onChange={e => setEditingJob({...editingJob, location: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Priority</label>
                                        <select value={editingJob.priority} onChange={e => setEditingJob({...editingJob, priority: e.target.value})} className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                            <option>Normal</option>
                                            <option>Medium</option>
                                            <option>High</option>
                                            <option>Urgent</option>
                                        </select>
                                    </div>
                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button type="button" onClick={() => setEditingJob(null)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                                        <button type="submit" className="px-5 py-2 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Team Selection Modal */}
                    {allocatingJobId && activeAllocatingJob && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col">
                                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                                    <div>
                                        <h3 className="font-bold text-slate-900 text-base">Assign Team to Task</h3>
                                        <p className="text-xs text-slate-500">{activeAllocatingJob.title}</p>
                                    </div>
                                    <button onClick={() => setAllocatingJobId(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                                </div>

                                <div className="py-3">
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1.5">Filter Workers by Department:</label>
                                    <div className="flex flex-wrap gap-1.5">
                                        <button onClick={() => setSelectedDeptFilter('All')} className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${selectedDeptFilter === 'All' ? 'bg-emerald-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>All Depts</button>
                                        {departments.map(dept => (
                                            <button key={dept} onClick={() => setSelectedDeptFilter(dept)} className={`text-xs px-3 py-1.5 rounded-lg font-bold transition ${selectedDeptFilter === dept ? 'bg-emerald-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>{dept}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-2 py-2 pr-1">
                                    <label className="block text-xs font-bold text-slate-500 uppercase">Select Team Members:</label>
                                    {filteredWorkers.length === 0 ? (
                                        <p className="text-xs text-slate-400 py-4 text-center">No workers found in this department.</p>
                                    ) : (
                                        filteredWorkers.map(w => {
                                            const isChecked = selectedWorkerIds.includes(w.phone);
                                            return (
                                                <div 
                                                    key={w.phone} 
                                                    onClick={() => toggleWorkerSelection(w.phone)}
                                                    className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition ${
                                                        isChecked ? 'bg-emerald-50 border-emerald-400' : 'bg-slate-50 border-slate-200 hover:border-slate-300'
                                                    }`}
                                                >
                                                    <div className="flex items-center space-x-3">
                                                        <input type="checkbox" checked={isChecked} onChange={() => {}} className="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" />
                                                        <div>
                                                            <p className="text-xs font-bold text-slate-900">{w.name}</p>
                                                            <p className="text-[11px] text-slate-500">{w.phone}</p>
                                                        </div>
                                                    </div>
                                                    <span className="text-[10px] bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded">{w.department}</span>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                <div className="pt-4 border-t border-slate-100 flex justify-end space-x-2">
                                    <button onClick={() => setAllocatingJobId(null)} className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl">Cancel</button>
                                    <button onClick={saveJobAssignments} className="px-5 py-2 text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md">Save & Dispatch WhatsApp ({selectedWorkerIds.length})</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
